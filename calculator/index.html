<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ride Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      cursor: pointer;
    }

    .results {
      margin-top: 25px;
    }

    .result {
      padding: 12px 0;
      border-bottom: 1px solid #ccc;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Ride Calculator</h1>

  <label for="riders">Number of Riders</label>
  <input
    type="number"
    id="riders"
    min="1"
    value="1"
  />

  <label for="rideType">Type of Ride</label>
  <select id="rideType">
    <option value="75">1 Hour — $75 per rider</option>
    <option value="110">1.5 Hour — $110 per rider</option>
    <option value="130">2 Hour — $130 per rider</option>
    <option value="150">Sunset — $150 per rider</option>
    <option value="250">Beach — $250 per rider</option>
    <option value="275">Beach Sunset — $275 per rider</option>
  </select>

  <label for="paymentType">Transaction Type</label>
  <select id="paymentType">
    <option value="card">Card</option>
    <option value="cash">Cash/Venmo</option>
  </select>

  <button onclick="calculate()">Calculate</button>

  <div class="results" id="results"></div>

  <script>
    function calculate() {
      const riders = parseInt(document.getElementById("riders").value);

      const rideSelect = document.getElementById("rideType");
      const ridePrice = parseFloat(rideSelect.value);

      const rideName =
        rideSelect.options[rideSelect.selectedIndex].text.split(" — ")[0];

      const paymentType =
        document.getElementById("paymentType").value;

      if (isNaN(riders) || riders < 1) {
        document.getElementById("results").innerHTML =
          "<p>Please enter at least 1 rider.</p>";
        return;
      }

      // Original ride cost
      const rideSubtotal = riders * ridePrice;

      // Add 5% if transaction type is Card
      const cardFee =
        paymentType === "card"
          ? rideSubtotal * 0.05
          : 0;

      // Base total includes the card surcharge
      const baseTotal = rideSubtotal + cardFee;

      // Split the full base total
      const ranchPayment = baseTotal * 0.80;
      const guidePayment = baseTotal * 0.20;

      const paymentName =
        paymentType === "card"
          ? "Card"
          : "Cash/Venmo";

      document.getElementById("results").innerHTML = `
        <div class="result">
          Ride: <strong>${rideName}</strong>
        </div>

        <div class="result">
          Riders: <strong>${riders}</strong>
        </div>

        <div class="result">
          Price Per Rider:
          <strong>$${ridePrice.toFixed(2)}</strong>
        </div>

        <div class="result">
          Transaction Type:
          <strong>${paymentName}</strong>
        </div>

        <div class="result">
          Ride Subtotal:
          <strong>$${rideSubtotal.toFixed(2)}</strong>
        </div>

        ${
          paymentType === "card"
            ? `
              <div class="result">
                Card Charge (5%):
                <strong>$${cardFee.toFixed(2)}</strong>
              </div>
            `
            : ""
        }

        <div class="result total">
          Base Total:
          $${baseTotal.toFixed(2)}
        </div>

        <div class="result">
          Paid to Ranch (80%):
          <strong>$${ranchPayment.toFixed(2)}</strong>
        </div>

        <div class="result">
          Paid to Guide (20%):
          <strong>$${guidePayment.toFixed(2)}</strong>
        </div>
      `;
    }
  </script>

</body>
</html>
