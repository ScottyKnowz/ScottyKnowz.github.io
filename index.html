<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Percentage Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    .results {
      margin-top: 25px;
    }

    .result {
      padding: 10px 0;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <h1>Calculator</h1>

  <label for="amount">Enter amount:</label>
  <input
    type="number"
    id="amount"
    placeholder="Enter a value"
    step="0.01"
  />

  <button onclick="calculate()">Calculate</button>

  <div class="results" id="results"></div>

  <script>
    function calculate() {
      const amount = parseFloat(document.getElementById("amount").value);

      if (isNaN(amount)) {
        document.getElementById("results").innerHTML =
          "<p>Please enter a valid number.</p>";
        return;
      }

      // Automatically add 15%
      const addedPercentage = 15;
      const adjustedTotal = amount * (1 + addedPercentage / 100);

      // Different portions of the adjusted value
      const portion50 = adjustedTotal * 0.50;
      const portion25 = adjustedTotal * 0.25;
      const portion10 = adjustedTotal * 0.10;

      document.getElementById("results").innerHTML = `
        <div class="result">
          Original: $${amount.toFixed(2)}
        </div>

        <div class="result">
          After adding ${addedPercentage}%:
          <strong>$${adjustedTotal.toFixed(2)}</strong>
        </div>

        <div class="result">
          50%: $${portion50.toFixed(2)}
        </div>

        <div class="result">
          25%: $${portion25.toFixed(2)}
        </div>

        <div class="result">
          10%: $${portion10.toFixed(2)}
        </div>
      `;
    }
  </script>

</body>
</html>
